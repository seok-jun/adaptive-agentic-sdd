<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-label="Adaptive SDD — try sandbox (real Codex runs, shortened)">
<style>
text{font-family:Consolas,'SFMono-Regular',Menlo,monospace;font-size:14px;white-space:pre}
.l{opacity:0;animation:show 16.20s steps(1,end) infinite}
@keyframes show{0%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}}
</style>
<rect width="880" height="440" rx="10" fill="#0f1419"/>
<rect width="880" height="36" rx="10" fill="#1b232c"/><rect y="26" width="880" height="10" fill="#1b232c"/>
<circle cx="20" cy="18" r="6" fill="#e5735f"/><circle cx="40" cy="18" r="6" fill="#e3b04b"/><circle cx="60" cy="18" r="6" fill="#5fc98b"/>
<text x="440" y="23" text-anchor="middle" fill="#7d8a97">Adaptive SDD — try sandbox (real Codex runs, shortened)</text>
<style>@keyframes k0{0%,3.70%{opacity:0}3.71%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k0" x="22" y="66" fill="#7d8a97"># Real Codex runs in the try sandbox, shortened. Full records: docs/eval-results/2026-11-07-try-sandbox</text>
<style>@keyframes k1{0%,7.10%{opacity:0}7.11%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k1" x="22" y="88" fill="#7cc4ff">$ python3 adaptive-agentic-sdd/try/setup.py</text>
<style>@keyframes k2{0%,10.49%{opacity:0}10.50%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k2" x="22" y="110" fill="#5fc98b">Product tests passed. Resolver: READY.</text>
<style>@keyframes k3{0%,22.53%{opacity:0}22.54%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k3" x="22" y="132" fill="#7cc4ff">You:   Fix catalog.search.page so page([1, 2, 3, 4], 1, 3) returns [1, 2, 3].</text>
<style>@keyframes k4{0%,25.93%{opacity:0}25.94%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k4" x="22" y="154" fill="#5fc98b">Agent: Resolver returned READY.</text>
<style>@keyframes k5{0%,29.32%{opacity:0}29.33%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k5" x="22" y="176" fill="#e3b04b">       Grade: Small — one implementation module and its tests.</text>
<style>@keyframes k6{0%,32.72%{opacity:0}32.73%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k6" x="22" y="198" fill="#d6dde4">       Created TRY-1; claimed catalog/search.py, tests/test_search.py.</text>
<style>@keyframes k7{0%,36.11%{opacity:0}36.12%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k7" x="22" y="220" fill="#d6dde4">       Off-by-one slice endpoint. Added 5 regression tests.</text>
<style>@keyframes k8{0%,39.51%{opacity:0}39.52%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k8" x="22" y="242" fill="#5fc98b">       Before the fix: FAILED (failures=5). After: 8 tests OK.</text>
<style>@keyframes k9{0%,42.90%{opacity:0}42.91%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k9" x="22" y="264" fill="#5fc98b">       Merged into origin/main (a1d61d0); TRY-1 closed, claim released.</text>
<style>@keyframes k10{0%,54.94%{opacity:0}54.95%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k10" x="22" y="286" fill="#7cc4ff">You:   Add password hashing and storage to members.</text>
<style>@keyframes k11{0%,58.33%{opacity:0}58.34%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k11" x="22" y="308" fill="#5fc98b">Agent: Resolver returned READY.</text>
<style>@keyframes k12{0%,61.73%{opacity:0}61.74%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k12" x="22" y="330" fill="#e5735f">       Grade: Large — changes secret handling.</text>
<style>@keyframes k13{0%,65.12%{opacity:0}65.13%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k13" x="22" y="352" fill="#d6dde4">       Recorded TRY-1. No product code changed, nothing merged.</text>
<style>@keyframes k14{0%,68.52%{opacity:0}68.53%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k14" x="22" y="374" fill="#e5735f">       [HUMAN DECISION REQUIRED] purpose, data to retain, storage boundary,</text>
<style>@keyframes k15{0%,71.91%{opacity:0}71.92%,100%{opacity:1}}</style>
<text class="l" style="animation-name:k15" x="22" y="396" fill="#d6dde4">       hashing algorithm, access rules, deletion policy.</text>
</svg>