<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Inter,Arial,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}.t{font-size:64px;font-weight:700;fill:#0B2451}.sub{font-size:24px;font-weight:700;fill:#5F6B7A}.ct{font-size:22px;font-weight:700}.b{font-size:15px}.h{font-size:22px;font-weight:700;fill:#0B2451}.num{font-size:17px;font-weight:700;fill:white}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0B2451"/></marker></defs><text x="900" y="80" class="t" text-anchor="middle">Adaptive Agentic SDD</text><text x="900" y="130" class="sub" text-anchor="middle">A risk-adaptive, evidence-gated workflow for AI coding agents</text><rect x="70" y="260" width="164" height="180" rx="20" fill="#F4F8FF" stroke="#1D5FBF" stroke-width="3"/><circle cx="102" cy="292" r="18" fill="#1D5FBF"/><text x="102" y="298" class="num" text-anchor="middle">1</text><text x="152.0" y="350" class="ct" fill="#1D5FBF" text-anchor="middle">Issue</text><text x="152.0" y="388" class="b" text-anchor="middle">Goal · Scope · AC</text><line x1="239" y1="350.0" x2="250" y2="350.0" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><rect x="256" y="260" width="164" height="180" rx="20" fill="#F1FBF9" stroke="#0F766E" stroke-width="3"/><circle cx="288" cy="292" r="18" fill="#0F766E"/><text x="288" y="298" class="num" text-anchor="middle">2</text><text x="338.0" y="350" class="ct" fill="#0F766E" text-anchor="middle">AS-IS</text><text x="338.0" y="388" class="b" text-anchor="middle">Observe current main</text><line x1="425" y1="350.0" x2="436" y2="350.0" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><rect x="442" y="260" width="164" height="180" rx="20" fill="#F1FBF9" stroke="#0F766E" stroke-width="3"/><circle cx="474" cy="292" r="18" fill="#0F766E"/><text x="474" y="298" class="num" text-anchor="middle">3</text><text x="524.0" y="350" class="ct" fill="#0F766E" text-anchor="middle">TO-BE</text><text x="524.0" y="388" class="b" text-anchor="middle">Design + Verification</text><line x1="611" y1="350.0" x2="622" y2="350.0" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><rect x="628" y="260" width="164" height="180" rx="20" fill="#FFF8ED" stroke="#C66A08" stroke-width="3"/><circle cx="660" cy="292" r="18" fill="#C66A08"/><text x="660" y="298" class="num" text-anchor="middle">4</text><text x="710.0" y="350" class="ct" fill="#C66A08" text-anchor="middle">Risk Gate</text><text x="710.0" y="388" class="b" text-anchor="middle">Small → Epic</text><line x1="797" y1="350.0" x2="808" y2="350.0" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><rect x="814" y="260" width="164" height="180" rx="20" fill="#F4FBF5" stroke="#237A3B" stroke-width="3"/><circle cx="846" cy="292" r="18" fill="#237A3B"/><text x="846" y="298" class="num" text-anchor="middle">5</text><text x="896.0" y="350" class="ct" fill="#237A3B" text-anchor="middle">Implement</text><text x="896.0" y="388" class="b" text-anchor="middle">Bounded changes</text><line x1="983" y1="350.0" x2="994" y2="350.0" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><rect x="1000" y="260" width="164" height="180" rx="20" fill="#F4FBF5" stroke="#237A3B" stroke-width="3"/><circle cx="1032" cy="292" r="18" fill="#237A3B"/><text x="1032" y="298" class="num" text-anchor="middle">6</text><text x="1082.0" y="350" class="ct" fill="#237A3B" text-anchor="middle">Verify</text><text x="1082.0" y="388" class="b" text-anchor="middle">Targeted → Broader</text><line x1="1169" y1="350.0" x2="1180" y2="350.0" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><rect x="1186" y="260" width="164" height="180" rx="20" fill="#F8F4FF" stroke="#6941A5" stroke-width="3"/><circle cx="1218" cy="292" r="18" fill="#6941A5"/><text x="1218" y="298" class="num" text-anchor="middle">7</text><text x="1268.0" y="350" class="ct" fill="#6941A5" text-anchor="middle">Review</text><text x="1268.0" y="388" class="b" text-anchor="middle">Self / Independent</text><line x1="1355" y1="350.0" x2="1366" y2="350.0" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><rect x="1372" y="260" width="164" height="180" rx="20" fill="#F1FBF9" stroke="#0F766E" stroke-width="3"/><circle cx="1404" cy="292" r="18" fill="#0F766E"/><text x="1404" y="298" class="num" text-anchor="middle">8</text><text x="1454.0" y="350" class="ct" fill="#0F766E" text-anchor="middle">Device QA?</text><text x="1454.0" y="388" class="b" text-anchor="middle">Only when needed</text><line x1="1541" y1="350.0" x2="1552" y2="350.0" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><rect x="1558" y="260" width="164" height="180" rx="20" fill="#F4FBF5" stroke="#237A3B" stroke-width="3"/><circle cx="1590" cy="292" r="18" fill="#237A3B"/><text x="1590" y="298" class="num" text-anchor="middle">9</text><text x="1640.0" y="350" class="ct" fill="#237A3B" text-anchor="middle">Merge</text><text x="1640.0" y="388" class="b" text-anchor="middle">Cleanup · Release</text><rect x="90" y="500" width="1620" height="132" rx="20" fill="#FAFBFC" stroke="#CBD5E1" stroke-width="2"/><text x="120" y="536" class="h">Reasoning / process depth scales with risk</text><rect x="120" y="565" width="300" height="47" rx="12" fill="white" stroke="#EEF2F6"/><text x="136" y="595" class="ct" font-size="18">Small</text><text x="232" y="595" class="b" fill="#5F6B7A">Lean</text><rect x="470" y="565" width="300" height="47" rx="12" fill="white" stroke="#EEF2F6"/><text x="486" y="595" class="ct" font-size="18">Medium</text><text x="582" y="595" class="b" fill="#5F6B7A">Standard</text><rect x="820" y="565" width="300" height="47" rx="12" fill="white" stroke="#EEF2F6"/><text x="836" y="595" class="ct" font-size="18">Large</text><text x="932" y="595" class="b" fill="#5F6B7A">Deep + Design Review</text><rect x="1170" y="565" width="300" height="47" rx="12" fill="white" stroke="#EEF2F6"/><text x="1186" y="595" class="ct" font-size="18">Epic</text><text x="1282" y="595" class="b" fill="#5F6B7A">Breakdown + Deep Review</text><rect x="90" y="675" width="500" height="115" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="114" y="710" class="h">Source of Truth</text><text x="114" y="748" class="b">Authority depends on information type</text><rect x="650" y="675" width="500" height="115" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="674" y="710" class="h">Trade-off Capture</text><text x="674" y="748" class="b">Record real choices; do not invent alternatives</text><rect x="1210" y="675" width="500" height="115" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="1234" y="710" class="h">Evidence Gate</text><text x="1234" y="748" class="b">Unrun or unproven checks are not PASS</text><text x="900" y="850" font-size="21" font-weight="700" fill="#C66A08" text-anchor="middle">Minimum process that reliably prevents costly mistakes</text></svg>