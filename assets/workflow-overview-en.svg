<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050" role="img" aria-labelledby="title desc">
<title id="title">Adaptive Agentic SDD — workflow overview</title><desc id="desc">Risk-dependent preparation converges on scoped implementation, AC-linked verification, required independent review, readiness, and final Human authorization. Required missing evidence blocks integration; Blind Audit is optional.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17243a}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#526278}.head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#526278}.tag{font-size:14px;font-weight:700;letter-spacing:1px;fill:#326665}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.gate{fill:#edf7f5;stroke:#81b3aa;stroke-width:1.5}.warn{fill:#fff5e6;stroke:#dca866;stroke-width:1.5}.optional{fill:#f5f3ff;stroke:#a394c5;stroke-width:1.5;stroke-dasharray:7 5}</style>
<path fill="#f5f7fa" d="M0 0H1280V1050H0Z"/>
<text x="48" y="58" class="title">Adaptive Agentic SDD</text>
<text x="48" y="91" class="sub">Risk-adaptive preparation. Evidence-based completion. Explicit integration authority.</text>
<rect x="48" y="124" width="550" height="94" rx="14" class="box"/>
<text x="68" y="158" class="head">01  Work item + preflight</text>
<text x="68" y="188" class="body">Current ACs, risk grade, allowed / forbidden edits, authority</text>
<path d="M600 171H661" class="edge"/>
<rect x="674" y="124" width="558" height="94" rx="14" class="gate"/>
<text x="694" y="158" class="head">02  Choose the minimum safe depth</text>
<text x="694" y="188" class="body">Read direct evidence; stop for unresolved boundaries</text>
<text x="48" y="253" class="tag">PREPARATION BY GRADE</text>
<rect x="48" y="274" width="224" height="156" rx="14" class="box"/>
<text x="68" y="308" class="head">Trivial</text>
<text x="68" y="338" class="body">Direct target</text>
<text x="68" y="363" class="body">No separate SDD</text>
<text x="68" y="388" class="body">No design review</text>
<rect x="288" y="274" width="224" height="156" rx="14" class="box"/>
<text x="308" y="308" class="head">Small</text>
<text x="308" y="338" class="body">Bounded inspection</text>
<text x="308" y="363" class="body">Plan in work item</text>
<text x="308" y="388" class="body">Self-review default</text>
<rect x="528" y="274" width="224" height="156" rx="14" class="box"/>
<text x="548" y="308" class="head">Medium</text>
<text x="548" y="338" class="body">Explicit AS-IS / PLAN</text>
<text x="548" y="363" class="body">Review when</text>
<text x="548" y="388" class="body">contract risk warrants</text>
<rect x="768" y="274" width="224" height="156" rx="14" class="gate"/>
<text x="788" y="308" class="head">Large</text>
<text x="788" y="338" class="body">AS-IS review</text>
<text x="788" y="363" class="body">then PLAN review</text>
<text x="788" y="388" class="body">Both independent</text>
<rect x="1008" y="274" width="224" height="156" rx="14" class="box"/>
<text x="1028" y="308" class="head">Epic</text>
<text x="1028" y="338" class="body">Break down first</text>
<text x="1028" y="363" class="body">Regrade child lanes</text>
<text x="1028" y="388" class="body">Own integration</text>
<text x="48" y="460" class="small">Human-owned design decisions need approval. Blind Audit is optional, not the default.</text>
<path d="M640 477V489H232V508" class="edge"/>
<rect x="48" y="520" width="368" height="130" rx="14" class="box"/>
<text x="68" y="554" class="head">03  Scoped implementation</text>
<text x="68" y="584" class="body">Preserve approved contracts</text>
<text x="68" y="609" class="body">Self-review against ACs</text>
<rect x="456" y="520" width="368" height="130" rx="14" class="box"/>
<text x="476" y="554" class="head">04  Verify + sync docs</text>
<text x="476" y="584" class="body">AC → actual result → evidence</text>
<text x="476" y="609" class="body">Targeted, final, and runtime checks</text>
<rect x="864" y="520" width="368" height="130" rx="14" class="box"/>
<text x="884" y="554" class="head">05  Independent CODE review</text>
<text x="884" y="584" class="body">Required by grade / contract risk</text>
<text x="884" y="609" class="body">Not the author’s self-review</text>
<path d="M418 584H443" class="edge"/>
<path d="M826 584H851" class="edge"/>
<path d="M1048 652V699" class="edge"/>
<rect x="864" y="716" width="368" height="132" rx="14" class="warn"/>
<text x="884" y="750" class="head">06  Readiness gate</text>
<text x="884" y="780" class="body">Required ACs PASS; reviews met</text>
<text x="884" y="805" class="body">Missing / failed evidence? STOP</text>
<rect x="456" y="716" width="368" height="132" rx="14" class="gate"/>
<text x="476" y="750" class="head">07  Final Human authorization</text>
<text x="476" y="780" class="body">Exact candidate + requested action</text>
<text x="476" y="805" class="body">Design approval ≠ merge approval</text>
<rect x="48" y="716" width="368" height="132" rx="14" class="box"/>
<text x="68" y="750" class="head">08  Authorized integration</text>
<text x="68" y="780" class="body">Merge / close / cleanup only</text>
<text x="68" y="805" class="body">within actual authority</text>
<path d="M862 782H837" class="edge"/>
<path d="M454 782H429" class="edge"/>
<text x="48" y="900" class="tag">NO SHORTCUT TO COMPLETION</text>
<text x="48" y="933" class="body">Required FAIL, BLOCKED, UNVERIFIED, or missing review prevents integration. Approval does not replace proof.</text>
<text x="48" y="961" class="small">A documented, applicable low-risk delegation is the only alternative to per-task final Human approval.</text>
<text x="48" y="1006" class="small">Reading aid only · Canonical policy: docs/workflow.md, risk-grades.md, review-gates.md, verification.md</text>
</svg>
