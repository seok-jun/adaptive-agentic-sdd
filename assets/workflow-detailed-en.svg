<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1740" viewBox="0 0 1400 1740" role="img" aria-labelledby="title desc">
<title id="title">Adaptive Agentic SDD — detailed workflow</title><desc id="desc">Large work has distinct independent AS-IS and PLAN gates. Other grades retain lean or risk-based routes. Verification and review blockers stop readiness. Final Human authorization is separate from design approval. Blind Audit is optional. Material changes return to affected gates.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17243a}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#526278}.head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#526278}.tag{font-size:14px;font-weight:700;letter-spacing:1px;fill:#326665}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.gate{fill:#edf7f5;stroke:#81b3aa;stroke-width:1.5}.warn{fill:#fff5e6;stroke:#dca866;stroke-width:1.5}.optional{fill:#f5f3ff;stroke:#a394c5;stroke-width:1.5;stroke-dasharray:7 5}</style>
<path fill="#f5f7fa" d="M0 0H1400V1740H0Z"/>
<text x="48" y="58" class="title">Adaptive Agentic SDD / detailed workflow</text>
<text x="48" y="92" class="sub">Follow the grade contract. Gate labels are conditional, not a requirement to maximize process.</text>
<rect x="48" y="124" width="790" height="94" rx="14" class="box"/>
<text x="68" y="158" class="head">01  Preflight + grade</text>
<text x="68" y="188" class="body">Current work item / ACs / scope / authority; unresolved requirements block edits.</text>
<rect x="48" y="250" width="790" height="94" rx="14" class="box"/>
<text x="68" y="284" class="head">02  Bounded AS-IS</text>
<text x="68" y="314" class="body">Direct code and evidence; Trivial skips a separate artifact, Small uses notes.</text>
<rect x="48" y="376" width="790" height="110" rx="14" class="gate"/>
<text x="68" y="410" class="head">03  Independent AS-IS gate — Large</text>
<text x="68" y="440" class="body">Review observations, direct dependencies, unknowns, and drift.</text>
<text x="68" y="465" class="body">Resolve blockers before relying on AS-IS as the settled PLAN baseline.</text>
<rect x="48" y="518" width="790" height="102" rx="14" class="box"/>
<text x="68" y="552" class="head">04  TO-BE + change plan + verification strategy</text>
<text x="68" y="582" class="body">Desired / preserved / failure behavior; ordered changes; AC proof methods.</text>
<rect x="48" y="652" width="790" height="110" rx="14" class="gate"/>
<text x="68" y="686" class="head">05  Independent PLAN gate — Large</text>
<text x="68" y="716" class="body">Review TO-BE and change plan at their own revision.</text>
<text x="68" y="741" class="body">Other grades follow risk-based policy; AS-IS PASS is not PLAN PASS.</text>
<rect x="48" y="794" width="790" height="94" rx="14" class="gate"/>
<text x="68" y="828" class="head">06  Design approval — when Human-owned</text>
<text x="68" y="858" class="body">Bind approval to phase, artifact revision, and decision scope.</text>
<rect x="48" y="920" width="790" height="94" rx="14" class="box"/>
<text x="68" y="954" class="head">07  Implement the authorized scope</text>
<text x="68" y="984" class="body">Preserve contracts and unrelated changes; regrade or stop for scope changes.</text>
<rect x="48" y="1046" width="790" height="110" rx="14" class="box"/>
<text x="68" y="1080" class="head">08  Verify + self-review + durable docs</text>
<text x="68" y="1110" class="body">AC-linked actual observations; sync from final code; final candidate checks.</text>
<text x="68" y="1135" class="body">Collect required runtime evidence here or before the readiness gate.</text>
<rect x="48" y="1188" width="790" height="94" rx="14" class="gate"/>
<text x="68" y="1222" class="head">09  Independent CODE review — when required</text>
<text x="68" y="1252" class="body">Separate reviewer; final candidate and evidence; material changes reopen gates.</text>
<rect x="48" y="1314" width="790" height="94" rx="14" class="warn"/>
<text x="68" y="1348" class="head">10  READY? Required evidence + review satisfied?</text>
<text x="68" y="1378" class="body">Required ACs PASS; no unresolved blocking findings or missing reviews.</text>
<rect x="48" y="1440" width="790" height="94" rx="14" class="gate"/>
<text x="68" y="1474" class="head">11  Final Human authorization</text>
<text x="68" y="1504" class="body">Exact candidate and integration action; pending authority means STOP.</text>
<rect x="48" y="1566" width="790" height="94" rx="14" class="box"/>
<text x="68" y="1600" class="head">12  Authorized integration + cleanup</text>
<text x="68" y="1630" class="body">Only approved merge / close / release actions; preserve required evidence.</text>
<path d="M443 220V240" class="edge"/>
<path d="M443 346V366" class="edge"/>
<path d="M443 488V508" class="edge"/>
<path d="M443 622V642" class="edge"/>
<path d="M443 764V784" class="edge"/>
<path d="M443 890V910" class="edge"/>
<path d="M443 1016V1036" class="edge"/>
<path d="M443 1158V1178" class="edge"/>
<path d="M443 1284V1304" class="edge"/>
<path d="M443 1410V1430" class="edge"/>
<path d="M443 1536V1556" class="edge"/>
<rect x="880" y="124" width="472" height="220" rx="14" class="box"/>
<text x="900" y="158" class="head">Grade-dependent preparation</text>
<text x="900" y="188" class="body">Trivial: direct validation; no design gate</text>
<text x="900" y="213" class="body">Small: bounded notes; self-review default</text>
<text x="900" y="238" class="body">Medium: explicit sections; risk-based review</text>
<text x="900" y="263" class="body">Large: separate AS-IS, PLAN, CODE verdicts</text>
<text x="900" y="288" class="body">Epic: split first; regrade risky child lanes</text>
<rect x="880" y="376" width="472" height="160" rx="14" class="box"/>
<text x="900" y="410" class="head">Independence is a role boundary</text>
<text x="900" y="440" class="body">Separate invocation / session or person</text>
<text x="900" y="465" class="body">Same model may be used</text>
<text x="900" y="490" class="body">Author self-review is not independent review</text>
<rect x="880" y="568" width="472" height="194" rx="14" class="optional"/>
<text x="900" y="602" class="head">Optional Blind Audit</text>
<text x="900" y="632" class="body">Independent of author and primary reviewer</text>
<text x="900" y="657" class="body">Same ACs, contracts, and safety boundaries</text>
<text x="900" y="682" class="body">Withhold prior findings until initial verdict</text>
<text x="900" y="707" class="body">Then reconcile; do not mandate everywhere</text>
<rect x="880" y="794" width="472" height="220" rx="14" class="box"/>
<text x="900" y="828" class="head">Bounded context and revisions</text>
<text x="900" y="858" class="body">Pass phase, scope, ACs, direct evidence</text>
<text x="900" y="883" class="body">Return findings and evidence references</text>
<text x="900" y="908" class="body">Read direct dependencies when needed</text>
<text x="900" y="933" class="body">Read access does not expand edit authority</text>
<text x="900" y="958" class="body">Reuse only unchanged, relevant context</text>
<rect x="880" y="1046" width="472" height="220" rx="14" class="warn"/>
<text x="900" y="1080" class="head">Verification states</text>
<text x="900" y="1110" class="body">PASS: observed evidence meets expectation</text>
<text x="900" y="1135" class="body">FAIL: observed evidence contradicts it</text>
<text x="900" y="1160" class="body">UNVERIFIED: unrun or insufficient evidence</text>
<text x="900" y="1185" class="body">BLOCKED: named obstacle prevents checking</text>
<text x="900" y="1210" class="body">Commands / queries generated ≠ executed</text>
<rect x="880" y="1314" width="472" height="220" rx="14" class="warn"/>
<text x="900" y="1348" class="head">STOP / return to affected gates</text>
<text x="900" y="1378" class="body">Required non-PASS or missing review? Stop.</text>
<text x="900" y="1403" class="body">Material candidate change? Recheck / review.</text>
<text x="900" y="1428" class="body">Refresh applicable approval for new target.</text>
<text x="900" y="1453" class="body">Human approval does not manufacture proof.</text>
<text x="900" y="1478" class="body">No bypass from a blocked gate to merge.</text>
<path d="M840 1361H869" class="edge"/>
<text x="850" y="1347" class="small">NO</text>
<text x="456" y="1422" class="small">YES</text>
<rect x="880" y="1566" width="472" height="94" rx="14" class="box"/>
<text x="900" y="1600" class="head">Narrow low-risk policy exception</text>
<text x="900" y="1630" class="body">Recorded eligibility + explicit delegation only.</text>
<text x="48" y="1706" class="small">Canonical meanings: docs/workflow.md · docs/risk-grades.md · docs/review-gates.md · docs/verification.md</text>
</svg>
