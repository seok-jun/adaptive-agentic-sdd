 text-anchor="middle">5</text><text x="1548" y="252" class="ct" fill="#0F766E">TO-BE + Verification</text><circle cx="1503" cy="295" r="4" fill="#0F766E"/><text x="1518" y="300" class="b">Desired behavior</text><circle cx="1503" cy="326" r="4" fill="#0F766E"/><text x="1518" y="331" class="b">Evidence per AC</text><circle cx="1503" cy="357" r="4" fill="#0F766E"/><text x="1518" y="362" class="b">Failure / error behavior</text><line x1="1811" y1="335.0" x2="1829" y2="335.0" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><rect x="1835" y="210" width="325" height="250" rx="18" fill="#FFF8ED" stroke="#C66A08" stroke-width="3"/><circle cx="1869" cy="244" r="18" fill="#C66A08"/><text x="1869" y="250" class="num" text-anchor="middle">6</text><text x="1901" y="252" class="ct" fill="#C66A08">Risk Grade Gate</text><circle cx="1856" cy="295" r="4" fill="#C66A08"/><text x="1871" y="300" class="b">Small: Lean</text><circle cx="1856" cy="326" r="4" fill="#C66A08"/><text x="1871" y="331" class="b">Medium: Standard</text><circle cx="1856" cy="357" r="4" fill="#C66A08"/><text x="1871" y="362" class="b">Large: Design Review</text><circle cx="1856" cy="388" r="4" fill="#C66A08"/><text x="1871" y="393" class="b">Epic: Breakdown + Review</text><rect x="1502" y="480" width="285" height="95" rx="14" fill="#FFF9E8" stroke="#D6A23A" stroke-width="2"/><text x="1520" y="510" class="ct" fill="#A66B00">Trade-off Capture</text><text x="1520" y="540" class="b">Only when real competing options are already visible</text><text x="1520" y="564" class="b">No extra brainstorming / repository-wide discovery</text><rect x="70" y="650" width="275" height="250" rx="18" fill="#F4FBF5" stroke="#237A3B" stroke-width="3"/><circle cx="101" cy="681" r="17" fill="#237A3B"/><text x="101" y="687" class="num" text-anchor="middle">7</text><text x="130" y="690" class="ct" fill="#237A3B">Implement</text><circle cx="89" cy="733" r="4" fill="#237A3B"/><text x="103" y="738" class="b">Allowed paths only</text><circl