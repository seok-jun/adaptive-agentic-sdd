="18" fill="#F7FBFF" stroke="#1D5FBF" stroke-width="2"/><text x="1045" y="1005" class="h" fill="#1D5FBF">Typical Device QA Triggers</text><text x="1045" y="1050" class="b">UI/UX · media · permissions/notifications · lifecycle · background work · DB migration · device-dependent behavior</text><rect x="1020" y="1160" width="1110" height="200" rx="18" fill="#FAFBFC" stroke="#CBD5E1" stroke-width="2"/><text x="1045" y="1200" class="h">Token Efficiency Principles</text><circle cx="1057" cy="1237" r="11" fill="#0B2451"/><text x="1057" y="1242" class="num" text-anchor="middle">1</text><text x="1080" y="1242" class="b">Do not batch-load unrelated documents</text><circle cx="1057" cy="1271" r="11" fill="#0B2451"/><text x="1057" y="1276" class="num" text-anchor="middle">2</text><text x="1080" y="1276" class="b">Start from direct paths and symbols</text><circle cx="1057" cy="1305" r="11" fill="#0B2451"/><text x="1057" y="1310" class="num" text-anchor="middle">3</text><text x="1080" y="1310" class="b">Reuse unchanged findings within one run</text><circle cx="1057" cy="1339" r="11" fill="#0B2451"/><text x="1057" y="1344" class="num" text-anchor="middle">4</text><text x="1080" y="1344" class="b">Do not ask review / QA to rediscover product intent</text><circle cx="1057" cy="1373" r="11" fill="#0B2451"/><text x="1057" y="1378" class="num" text-anchor="middle">5</text><text x="1080" y="1378" class="b">Run targeted verification first</text><text x="1100" y="1440" font-size="20" font-weight="700" fill="#C66A08" text-anchor="middle">Core idea: spend reasoning where failure is expensive; avoid ceremony where it is not.</text></svg>