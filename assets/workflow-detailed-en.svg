 cx="986" cy="733" r="4" fill="#237A3B"/><text x="1000" y="738" class="b">Final code as authority</text><circle cx="986" cy="764" r="4" fill="#237A3B"/><text x="1000" y="769" class="b">Update only changed rules</text><line x1="1246" y1="775.0" x2="1260" y2="775.0" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><rect x="1266" y="650" width="275" height="250" rx="18" fill="#F8F4FF" stroke="#6941A5" stroke-width="3"/><circle cx="1297" cy="681" r="17" fill="#6941A5"/><text x="1297" y="687" class="num" text-anchor="middle">11</text><text x="1326" y="690" class="ct" fill="#6941A5">PR / Review</text><circle cx="1285" cy="733" r="4" fill="#6941A5"/><text x="1299" y="738" class="b">PR scope = issue scope</text><circle cx="1285" cy="764" r="4" fill="#6941A5"/><text x="1299" y="769" class="b">Grade-based review</text><circle cx="1285" cy="795" r="4" fill="#6941A5"/><text x="1299" y="800" class="b">Independent review for Large/Epic</text><line x1="1545" y1="775.0" x2="1559" y2="775.0" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><rect x="1565" y="650" width="275" height="250" rx="18" fill="#F1FBF9" stroke="#0F766E" stroke-width="3"/><circle cx="1596" cy="681" r="17" fill="#0F766E"/><text x="1596" y="687" class="num" text-anchor="middle">12</text><text x="1625" y="690" class="ct" fill="#0F766E">Device QA Gate</text><circle cx="1584" cy="733" r="4" fill="#0F766E"/><text x="1598" y="738" class="b">Only when required</text><circle cx="1584" cy="764" r="4" fill="#0F766E"/><text x="1598" y="769" class="b">AC-based checklist</text><circle cx="1584" cy="795" r="4" fill="#0F766E"/><text x="1598" y="800" class="b">Observation ≠ judgment</text><line x1="1844" y1="775.0" x2="1858" y2="775.0" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><rect x="1864" y="650" width="275" height="250" rx="18" fill="#F4FBF5" stroke="#237A3B" stroke-width="3"/><circle cx="1895" cy="681" r="17" fill="#237A3B"/><text x="1895" y="687" class="num" text-anchor="middle">13</text><text 