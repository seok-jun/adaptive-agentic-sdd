<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#172033}.t{font-size:58px;font-weight:700;fill:#0B2451}.s{font-size:22px;font-weight:700;fill:#5F6B7A}.h{font-size:24px;font-weight:700;fill:#0B2451}.ct{font-size:18px;font-weight:700}.b{font-size:13px}.sm{font-size:12px}.num{font-size:13px;font-weight:700;fill:white}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0B2451"/></marker></defs><text x="900" y="62" class="t" text-anchor="middle">Adaptive Agentic SDD</text><text x="900" y="103" class="s" text-anchor="middle">Issue-first · Risk-Gated · Verification Strategy · Device QA · Bounded Exploration</text><rect x="40" y="130" width="1720" height="82" rx="16" fill="#FAFBFC" stroke="#CBD5E1" stroke-width="1"/><text x="70" y="158" class="ct" fill="#0B2451">Core principles</text><text x="70" y="187" class="b">Issue-first · Observed AS-IS · Risk-Adaptive · Bounded Exploration · Evidence-based · Lifecycle Completion</text><text x="45" y="252" class="h">Design · Planning</text><rect x="45" y="270" width="250" height="205" rx="14" fill="#F4F8FF" stroke="#1D5FBF" stroke-width="2"/><circle cx="70" cy="297" r="15" fill="#1D5FBF"/><text x="70" y="302" class="num" text-anchor="middle">1</text><text x="95" y="303" class="ct" fill="#1D5FBF">Issue Definition</text><circle cx="63" cy="333" r="3.5" fill="#1D5FBF"/><text x="75" y="337" class="b">Priority / SDD grade</text><circle cx="63" cy="360" r="3.5" fill="#1D5FBF"/><text x="75" y="364" class="b">Goal, scope, acceptance</text><text x="75" y="384" class="b">criteria</text><circle cx="63" cy="407" r="3.5" fill="#1D5FBF"/><text x="75" y="411" class="b">Allowed / forbidden</text><circle cx="63" cy="434" r="3.5" fill="#1D5FBF"/><text x="75" y="438" class="b">Dependencies / blockers</text><rect x="330" y="270" width="250" height="205" rx="14" fill="#F4F8FF" stroke="#1D5FBF" stroke-width="2"/><circle cx="355" cy="297" r="15" fill="#1D5FBF"/><text x="355" y="302" class="num" text-anchor="middle">2</text><text x="380" y="303" class="ct" fill="#1D5FBF">Preflight</text><circle cx="348" cy="333" r="3.5" fill="#1D5FBF"/><text x="360" y="337" class="b">Issue metadata</text><text x="360" y="357" class="b">consistency</text><circle cx="348" cy="380" r="3.5" fill="#1D5FBF"/><text x="360" y="384" class="b">Dependency / blocker</text><circle cx="348" cy="407" r="3.5" fill="#1D5FBF"/><text x="360" y="411" class="b">Safe-to-start check</text><rect x="615" y="270" width="250" height="205" rx="14" fill="#F8F4FF" stroke="#6941A5" stroke-width="2"/><circle cx="640" cy="297" r="15" fill="#6941A5"/><text x="640" y="302" class="num" text-anchor="middle">3</text><text x="665" y="303" class="ct" fill="#6941A5">Claim / Isolation</text><circle cx="633" cy="333" r="3.5" fill="#6941A5"/><text x="645" y="337" class="b">Lane overlap check</text><circle cx="633" cy="360" r="3.5" fill="#6941A5"/><text x="645" y="364" class="b">Branch / worktree</text><circle cx="633" cy="387" r="3.5" fill="#6941A5"/><text x="645" y="391" class="b">Scope boundary lock</text><rect x="900" y="270" width="250" height="205" rx="14" fill="#F1FBF9" stroke="#0F766E" stroke-width="2"/><circle cx="925" cy="297" r="15" fill="#0F766E"/><text x="925" y="302" class="num" text-anchor="middle">4</text><text x="950" y="303" class="ct" fill="#0F766E">AS-IS Analysis</text><circle cx="918" cy="333" r="3.5" fill="#0F766E"/><text x="930" y="337" class="b">Current mainline</text><circle cx="918" cy="360" r="3.5" fill="#0F766E"/><text x="930" y="364" class="b">Direct path / symbol</text><text x="930" y="384" class="b">first</text><circle cx="918" cy="407" r="3.5" fill="#0F766E"/><text x="930" y="411" class="b">Minimal relevant docs</text><rect x="1185" y="270" width="250" height="205" rx="14" fill="#F1FBF9" stroke="#0F766E" stroke-width="2"/><circle cx="1210" cy="297" r="15" fill="#0F766E"/><text x="1210" y="302" class="num" text-anchor="middle">5</text><text x="1235" y="303" class="ct" fill="#0F766E">TO-BE + Verification</text><circle cx="1203" cy="333" r="3.5" fill="#0F766E"/><text x="1215" y="337" class="b">Desired behavior</text><circle cx="1203" cy="360" r="3.5" fill="#0F766E"/><text x="1215" y="364" class="b">Evidence per acceptance</text><text x="1215" y="384" class="b">criterion</text><circle cx="1203" cy="407" r="3.5" fill="#0F766E"/><text x="1215" y="411" class="b">Failure / error behavior</text><rect x="1470" y="270" width="250" height="205" rx="14" fill="#FFF8ED" stroke="#C66A08" stroke-width="2"/><circle cx="1495" cy="297" r="15" fill="#C66A08"/><text x="1495" y="302" class="num" text-anchor="middle">6</text><text x="1520" y="303" class="ct" fill="#C66A08">Risk Grade Gate</text><circle cx="1488" cy="333" r="3.5" fill="#C66A08"/><text x="1500" y="337" class="b">Small: Lean</text><circle cx="1488" cy="360" r="3.5" fill="#C66A08"/><text x="1500" y="364" class="b">Medium: Standard</text><circle cx="1488" cy="387" r="3.5" fill="#C66A08"/><text x="1500" y="391" class="b">Large: Design Review</text><circle cx="1488" cy="414" r="3.5" fill="#C66A08"/><text x="1500" y="418" class="b">Epic: Breakdown +</text><text x="1500" y="438" class="b">Review</text><line x1="295" y1="373" x2="320" y2="373" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><line x1="580" y1="373" x2="605" y2="373" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><line x1="865" y1="373" x2="890" y2="373" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><line x1="1150" y1="373" x2="1175" y2="373" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><line x1="1435" y1="373" x2="1460" y2="373" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><rect x="1185" y="488" width="250" height="62" rx="12" fill="#FFF9E8" stroke="#D6A23A" stroke-width="1"/><text x="1200" y="512" class="ct" fill="#A66B00">Trade-off Capture</text><text x="1200" y="536" class="sm">Only when real competing options exist</text><text x="45" y="585" class="h">Implementation · Verification · Completion</text><rect x="45" y="605" width="230" height="205" rx="14" fill="#F4FBF5" stroke="#237A3B" stroke-width="2"/><circle cx="70" cy="632" r="15" fill="#237A3B"/><text x="70" y="637" class="num" text-anchor="middle">7</text><text x="95" y="638" class="ct" fill="#237A3B">Implement</text><circle cx="63" cy="668" r="3.5" fill="#237A3B"/><text x="75" y="672" class="b">Allowed paths only</text><circle cx="63" cy="695" r="3.5" fill="#237A3B"/><text x="75" y="699" class="b">No scope creep</text><circle cx="63" cy="722" r="3.5" fill="#237A3B"/><text x="75" y="726" class="b">Regression coverage</text><rect x="300" y="605" width="230" height="205" rx="14" fill="#F4FBF5" stroke="#237A3B" stroke-width="2"/><circle cx="325" cy="632" r="15" fill="#237A3B"/><text x="325" y="637" class="num" text-anchor="middle">8</text><text x="350" y="638" class="ct" fill="#237A3B">Verify</text><circle cx="318" cy="668" r="3.5" fill="#237A3B"/><text x="330" y="672" class="b">Targeted checks first</text><circle cx="318" cy="695" r="3.5" fill="#237A3B"/><text x="330" y="699" class="b">Broader checks only</text><text x="330" y="719" class="b">when required</text><circle cx="318" cy="742" r="3.5" fill="#237A3B"/><text x="330" y="746" class="b">Unrun ≠ PASS</text><rect x="555" y="605" width="230" height="205" rx="14" fill="#F4FBF5" stroke="#237A3B" stroke-width="2"/><circle cx="580" cy="632" r="15" fill="#237A3B"/><text x="580" y="637" class="num" text-anchor="middle">9</text><text x="605" y="638" class="ct" fill="#237A3B">Self Review</text><circle cx="573" cy="668" r="3.5" fill="#237A3B"/><text x="585" y="672" class="b">Diff ↔ acceptance criteria</text><circle cx="573" cy="695" r="3.5" fill="#237A3B"/><text x="585" y="699" class="b">Remove scope creep</text><circle cx="573" cy="722" r="3.5" fill="#237A3B"/><text x="585" y="726" class="b">Check unrelated paths</text><rect x="810" y="605" width="230" height="205" rx="14" fill="#F4FBF5" stroke="#237A3B" stroke-width="2"/><circle cx="835" cy="632" r="15" fill="#237A3B"/><text x="835" y="637" class="num" text-anchor="middle">10</text><text x="860" y="638" class="ct" fill="#237A3B">Docs Sync</text><circle cx="828" cy="668" r="3.5" fill="#237A3B"/><text x="840" y="672" class="b">Final code as authority</text><circle cx="828" cy="695" r="3.5" fill="#237A3B"/><text x="840" y="699" class="b">Update only changed</text><text x="840" y="719" class="b">product rules</text><rect x="1065" y="605" width="230" height="205" rx="14" fill="#F4FBF5" stroke="#237A3B" stroke-width="2"/><circle cx="1090" cy="632" r="15" fill="#237A3B"/><text x="1090" y="637" class="num" text-anchor="middle">11</text><text x="1115" y="638" class="ct" fill="#237A3B">PR / Review</text><circle cx="1083" cy="668" r="3.5" fill="#237A3B"/><text x="1095" y="672" class="b">PR scope = issue scope</text><circle cx="1083" cy="695" r="3.5" fill="#237A3B"/><text x="1095" y="699" class="b">Grade-based review</text><circle cx="1083" cy="722" r="3.5" fill="#237A3B"/><text x="1095" y="726" class="b">Independent review for</text><text x="1095" y="746" class="b">Large / Epic</text><rect x="1320" y="605" width="230" height="205" rx="14" fill="#F1FBF9" stroke="#0F766E" stroke-width="2"/><circle cx="1345" cy="632" r="15" fill="#0F766E"/><text x="1345" y="637" class="num" text-anchor="middle">12</text><text x="1370" y="638" class="ct" fill="#0F766E">Device QA Gate</text><circle cx="1338" cy="668" r="3.5" fill="#0F766E"/><text x="1350" y="672" class="b">Only when required</text><circle cx="1338" cy="695" r="3.5" fill="#0F766E"/><text x="1350" y="699" class="b">AC-based checklist</text><circle cx="1338" cy="722" r="3.5" fill="#0F766E"/><text x="1350" y="726" class="b">Observation separate</text><text x="1350" y="746" class="b">from judgment</text><rect x="1575" y="605" width="230" height="205" rx="14" fill="#F4FBF5" stroke="#237A3B" stroke-width="2"/><circle cx="1600" cy="632" r="15" fill="#237A3B"/><text x="1600" y="637" class="num" text-anchor="middle">13</text><text x="1625" y="638" class="ct" fill="#237A3B">Merge / Cleanup</text><circle cx="1593" cy="668" r="3.5" fill="#237A3B"/><text x="1605" y="672" class="b">Required PASS first</text><circle cx="1593" cy="695" r="3.5" fill="#237A3B"/><text x="1605" y="699" class="b">Close issue</text><circle cx="1593" cy="722" r="3.5" fill="#237A3B"/><text x="1605" y="726" class="b">Remove temporary SDD</text><circle cx="1593" cy="749" r="3.5" fill="#237A3B"/><text x="1605" y="753" class="b">Release lane / worktree</text><line x1="275" y1="708" x2="290" y2="708" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><line x1="530" y1="708" x2="545" y2="708" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><line x1="785" y1="708" x2="800" y2="708" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><line x1="1040" y1="708" x2="1055" y2="708" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><line x1="1295" y1="708" x2="1310" y2="708" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><line x1="1550" y1="708" x2="1565" y2="708" stroke="#0B2451" stroke-width="4" marker-end="url(#a)"/><rect x="45" y="855" width="760" height="195" rx="15" fill="#FAFBFC" stroke="#CBD5E1" stroke-width="1"/><text x="70" y="888" class="h">Information-specific Source of Truth</text><text x="70" y="918" class="b" font-weight="700">User instruction</text><text x="70" y="935" class="sm" fill="#5F6B7A">Current session request</text><text x="70" y="957" class="b" font-weight="700">Goal / scope / AC</text><text x="70" y="974" class="sm" fill="#5F6B7A">Current issue body</text><text x="70" y="996" class="b" font-weight="700">AS-IS</text><text x="70" y="1013" class="sm" fill="#5F6B7A">Current mainline code</text><text x="420" y="918" class="b" font-weight="700">Architecture boundary</text><text x="420" y="935" class="sm" fill="#5F6B7A">Architecture rules</text><text x="420" y="957" class="b" font-weight="700">Durable product rules</text><text x="420" y="974" class="sm" fill="#5F6B7A">Synchronized product docs</text><text x="420" y="996" class="b" font-weight="700">UI state / layout</text><text x="420" y="1013" class="sm" fill="#5F6B7A">Issue-linked visual spec</text><rect x="835" y="855" width="920" height="78" rx="15" fill="#F7FBFF" stroke="#1D5FBF" stroke-width="1"/><text x="860" y="885" class="ct" fill="#1D5FBF">Typical Device QA triggers</text><text x="860" y="913" class="b">UI/UX · media · permissions · lifecycle · background work · DB migration · device-dependent behavior</text><rect x="835" y="947" width="920" height="103" rx="15" fill="#FAFBFC" stroke="#CBD5E1" stroke-width="1"/><text x="860" y="978" class="ct" fill="#0B2451">Token efficiency</text><text x="860" y="1005" class="b">No unrelated bulk reads · direct paths/symbols first · reuse findings in the same run</text><text x="860" y="1029" class="b">No product rediscovery in review/QA · targeted verification first</text><text x="900" y="1093" fill="#C66A08" text-anchor="middle" font-size="18" font-weight="700">Core idea: spend reasoning where failure is expensive, and catch wrong answers inside a narrowed problem space</text></svg>