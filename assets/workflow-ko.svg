<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<rect width="1800" height="1120" fill="white"/>
<style>
text{font-family:"Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#172033}
.t{font-size:58px;font-weight:700;fill:#0B2451}.s{font-size:23px;font-weight:700;fill:#5F6B7A}.h{font-size:24px;font-weight:700;fill:#0B2451}.ct{font-size:18px;font-weight:700}.b{font-size:13px}.sm{font-size:12px}.num{font-size:13px;font-weight:700;fill:white}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0B2451"/></marker></defs>
<text x="900" y="62" class="t" text-anchor="middle">Adaptive Agentic SDD</text>
<text x="900" y="105" class="s" text-anchor="middle">Issue-first · Risk-Gated · Verification Strategy · Device QA · Bounded Exploration</text>
<rect x="40" y="135" width="1720" height="82" rx="16" fill="#FAFBFC" stroke="#CBD5E1"/>
<g>
<text x="70" y="164" class="ct" fill="#0B2451">핵심 원칙</text>
<text x="70" y="192" class="b">Issue-first · Observed AS-IS · Risk-Adaptive · Bounded Exploration · Evidence-based · Lifecycle Completion</text>
</g>
<text x="45" y="265" class="h">설계 · 계획</text>
<!-- top cards -->
<g>
<rect x="45" y="285" width="250" height="205" rx="14" fill="#F4F8FF" stroke="#1D5FBF" stroke-width="2"/><circle cx="70" cy="312" r="15" fill="#1D5FBF"/><text x="70" y="317" class="num" text-anchor="middle">1</text><text x="95" y="318" class="ct" fill="#1D5FBF">Issue 정의</text><text x="65" y="352" class="b">• Priority / SDD grade</text><text x="65" y="379" class="b">• 목표·범위·완료 기준</text><text x="65" y="406" class="b">• 수정 허용·금지</text><text x="65" y="433" class="b">• 의존성·차단 요소</text>
<rect x="330" y="285" width="250" height="205" rx="14" fill="#F4F8FF" stroke="#1D5FBF" stroke-width="2"/><circle cx="355" cy="312" r="15" fill="#1D5FBF"/><text x="355" y="317" class="num" text-anchor="middle">2</text><text x="380" y="318" class="ct" fill="#1D5FBF">Preflight</text><text x="350" y="352" class="b">• 본문·라벨 일치</text><text x="350" y="379" class="b">• blocker / dependency</text><text x="350" y="406" class="b">• 구현 가능 여부</text>
<rect x="615" y="285" width="250" height="205" rx="14" fill="#F8F4FF" stroke="#6941A5" stroke-width="2"/><circle cx="640" cy="312" r="15" fill="#6941A5"/><text x="640" y="317" class="num" text-anchor="middle">3</text><text x="665" y="318" class="ct" fill="#6941A5">Claim / Isolation</text><text x="635" y="352" class="b">• lane 충돌 검사</text><text x="635" y="379" class="b">• branch / worktree</text><text x="635" y="406" class="b">• 작업 범위 고정</text>
<rect x="900" y="285" width="250" height="205" rx="14" fill="#F1FBF9" stroke="#0F766E" stroke-width="2"/><circle cx="925" cy="312" r="15" fill="#0F766E"/><text x="925" y="317" class="num" text-anchor="middle">4</text><text x="950" y="318" class="ct" fill="#0F766E">AS-IS 분석</text><text x="920" y="352" class="b">• current main 기준</text><text x="920" y="379" class="b">• direct path / symbol</text><text x="920" y="406" class="b">• 관련 문서 최소 조회</text>
<rect x="1185" y="285" width="250" height="205" rx="14" fill="#F1FBF9" stroke="#0F766E" stroke-width="2"/><circle cx="1210" cy="312" r="15" fill="#0F766E"/><text x="1210" y="317" class="num" text-anchor="middle">5</text><text x="1235" y="318" class="ct" fill="#0F766E">TO-BE + 검증 전략</text><text x="1205" y="352" class="b">• 변경 후 동작</text><text x="1205" y="379" class="b">• AC별 검증 방법</text><text x="1205" y="406" class="b">• 실패·예외 동작</text><text x="1205" y="445" class="sm" fill="#A66B00">Trade-off: 실제 경쟁안이 있을 때만 기록</text>
<rect x="1470" y="285" width="250" height="205" rx="14" fill="#FFF8ED" stroke="#C66A08" stroke-width="2"/><circle cx="1495" cy="312" r="15" fill="#C66A08"/><text x="1495" y="317" class="num" text-anchor="middle">6</text><text x="1520" y="318" class="ct" fill="#C66A08">Grade Gate</text><text x="1490" y="352" class="b">• Small: Lean</text><text x="1490" y="379" class="b">• Medium: Standard</text><text x="1490" y="406" class="b">• Large: Design Review</text><text x="1490" y="433" class="b">• Epic: Breakdown + Review</text>
</g>
<g stroke="#0B2451" stroke-width="4" marker-end="url(#a)"><line x1="295" y1="388" x2="320" y2="388"/><line x1="580" y1="388" x2="605" y2="388"/><line x1="865" y1="388" x2="890" y2="388"/><line x1="1150" y1="388" x2="1175" y2="388"/><line x1="1435" y1="388" x2="1460" y2="388"/></g>
<text x="45" y="555" class="h">구현 · 검증 · 완료</text>
<!-- bottom cards -->
<g>
<rect x="45" y="575" width="230" height="205" rx="14" fill="#F4FBF5" stroke="#237A3B" stroke-width="2"/><circle cx="70" cy="602" r="15" fill="#237A3B"/><text x="70" y="607" class="num" text-anchor="middle">7</text><text x="95" y="608" class="ct" fill="#237A3B">구현</text><text x="65" y="642" class="b">• allowed path만 수정</text><text x="65" y="669" class="b">• AC 밖 변경 금지</text><text x="65" y="696" class="b">• 회귀 테스트 추가</text>
<rect x="300" y="575" width="230" height="205" rx="14" fill="#F4FBF5" stroke="#237A3B" stroke-width="2"/><circle cx="325" cy="602" r="15" fill="#237A3B"/><text x="325" y="607" class="num" text-anchor="middle">8</text><text x="350" y="608" class="ct" fill="#237A3B">검증</text><text x="320" y="642" class="b">• targeted test 우선</text><text x="320" y="669" class="b">• 필요 시 broader test</text><text x="320" y="696" class="b">• 미실행은 PASS 아님</text>
<rect x="555" y="575" width="230" height="205" rx="14" fill="#F4FBF5" stroke="#237A3B" stroke-width="2"/><circle cx="580" cy="602" r="15" fill="#237A3B"/><text x="580" y="607" class="num" text-anchor="middle">9</text><text x="605" y="608" class="ct" fill="#237A3B">자체 리뷰</text><text x="575" y="642" class="b">• diff ↔ AC 대조</text><text x="575" y="669" class="b">• scope creep 제거</text><text x="575" y="696" class="b">• unrelated path 확인</text>
<rect x="810" y="575" width="230" height="205" rx="14" fill="#F4FBF5" stroke="#237A3B" stroke-width="2"/><circle cx="835" cy="602" r="15" fill="#237A3B"/><text x="835" y="607" class="num" text-anchor="middle">10</text><text x="860" y="608" class="ct" fill="#237A3B">Business 동기화</text><text x="830" y="642" class="b">• 최종 코드 기준</text><text x="830" y="669" class="b">• 실제 바뀐 규칙만 갱신</text>
<rect x="1065" y="575" width="230" height="205" rx="14" fill="#F4FBF5" stroke="#237A3B" stroke-width="2"/><circle cx="1090" cy="602" r="15" fill="#237A3B"/><text x="1090" y="607" class="num" text-anchor="middle">11</text><text x="1115" y="608" class="ct" fill="#237A3B">PR / Review</text><text x="1085" y="642" class="b">• PR 범위 = Issue 범위</text><text x="1085" y="669" class="b">• grade별 review gate</text><text x="1085" y="696" class="b">• Large/Epic 독립 리뷰</text>
<rect x="1320" y="575" width="230" height="205" rx="14" fill="#F1FBF9" stroke="#0F766E" stroke-width="2"/><circle cx="1345" cy="602" r="15" fill="#0F766E"/><text x="1345" y="607" class="num" text-anchor="middle">12</text><text x="1370" y="608" class="ct" fill="#0F766E">Device QA Gate</text><text x="1340" y="642" class="b">• 필요한 PR만 적용</text><text x="1340" y="669" class="b">• AC 기반 체크리스트</text><text x="1340" y="696" class="b">• 관측과 판정 분리</text>
<rect x="1575" y="575" width="180" height="205" rx="14" fill="#F4FBF5" stroke="#237A3B" stroke-width="2"/><circle cx="1600" cy="602" r="15" fill="#237A3B"/><text x="1600" y="607" class="num" text-anchor="middle">13</text><text x="1625" y="608" class="ct" fill="#237A3B">Merge</text><text x="1595" y="642" class="b">• 필수 PASS</text><text x="1595" y="669" class="b">• Issue close</text><text x="1595" y="696" class="b">• 임시 SDD 정리</text><text x="1595" y="723" class="b">• lane release</text>
</g>
<g stroke="#0B2451" stroke-width="4" marker-end="url(#a)"><line x1="275" y1="678" x2="290" y2="678"/><line x1="530" y1="678" x2="545" y2="678"/><line x1="785" y1="678" x2="800" y2="678"/><line x1="1040" y1="678" x2="1055" y2="678"/><line x1="1295" y1="678" x2="1310" y2="678"/><line x1="1550" y1="678" x2="1565" y2="678"/></g>
<!-- lower panels -->
<rect x="45" y="825" width="760" height="220" rx="15" fill="#FAFBFC" stroke="#CBD5E1"/><text x="70" y="860" class="h">정보별 기준 출처 (Source of Truth)</text><text x="70" y="895" class="b">사용자 지시 → 현재 세션</text><text x="70" y="923" class="b">목표·범위·완료 기준 → 현재 Issue</text><text x="70" y="951" class="b">AS-IS → current main code</text><text x="410" y="895" class="b">아키텍처·모듈 경계 → architecture rules</text><text x="410" y="923" class="b">구현 후 제품 규칙 → durable product docs</text><text x="410" y="951" class="b">UI 상태·배치 → Issue-linked Visual Spec</text>
<rect x="835" y="825" width="920" height="95" rx="15" fill="#F7FBFF" stroke="#1D5FBF"/><text x="860" y="860" class="ct" fill="#1D5FBF">Device QA 기본 trigger</text><text x="860" y="892" class="b">UI/UX · 미디어 · permission/notification · lifecycle · background · DB migration · 기기 의존 동작</text>
<rect x="835" y="940" width="920" height="105" rx="15" fill="#FAFBFC" stroke="#CBD5E1"/><text x="860" y="975" class="ct" fill="#0B2451">토큰 효율 원칙</text><text x="860" y="1007" class="b">관련 없는 문서 일괄 조회 금지 · direct path/symbol 우선 · 같은 run 결과 재사용 · review/QA 재탐색 금지 · targeted verification 우선</text>
<text x="900" y="1090" font-size="19" font-weight="700" fill="#C66A08" text-anchor="middle">핵심 철학: 많이 탐색하는 것보다, 이미 좁혀진 문제에서 틀린 답을 걸러내는 흐름</text>
</svg>